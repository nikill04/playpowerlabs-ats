services:
  talon-backend:
    build:
      context: ./talon-backend-phase1-old/server
    env_file:
      - ./talon-backend-phase1-old/server/.env
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      FRONTEND_URL: "http://localhost:5173"
      DB_PATH: "/app/data/talon.db"
    volumes:
      - ./talon-backend-phase1-old/server/data:/app/data
